<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mermaid Preview</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow: hidden;
            cursor: grab;
            /* Dragging the canvas is a pan gesture, not a text selection. Without this,
               panning highlights every SVG label. The error overlay opts back in below,
               so its message stays selectable and copyable. */
            user-select: none;
        }
        #container {
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--background-color, #ffffff);
        }
        #diagram {
            transform-origin: center center;
        }
        /*
          Applied only for discrete, one-shot zoom actions -- never while panning or
          wheel-zooming.

          A transition that is always on turns every pan mousemove into a fresh 100ms
          interpolation, so the diagram permanently lags the cursor and its text is
          resampled at fractional offsets mid-animation. That is the pan blur. It also
          corrupted fitToView(), which resets the transform and measures the result on
          the next frame -- while the reset was still animating.
        */
        #diagram.animated {
            transition: transform 0.1s ease-out;
        }
        #diagram svg { max-width: none; }
        #error {
            position: absolute;
            bottom: 20px;
            left: 20px;
            right: 20px;
            padding: 12px 16px;
            background: #fee;
            border: 1px solid #fcc;
            border-radius: 4px;
            color: #c00;
            font-size: 13px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        /* Opt back in to selection: the whole point of an error message is being able
           to read and copy it, and body sets user-select: none for panning. */
        #error { user-select: text; }
        #error-message { flex: 1; }
        #report-link { font-size: 12px; color: #666; text-align: right; }
        #report-link:hover { color: #333; }
        .hidden { display: none !important; }
        body.dark { --background-color: #1e1e1e; }
        body.dark #error {
            background: #3a1a1a;
            border-color: #5a2a2a;
            color: #faa;
        }
        body.dark #report-link { color: #aaa; }
        body.dark #report-link:hover { color: #fff; }
    </style>
    <!--
      User-supplied CSS from Settings > Nereid, filled in by applyCustomCss().
      Last in the head so it wins over the rules above at equal specificity.
    -->
    <style id="custom-css"></style>
    <!--
      Mermaid is inlined from the plugin bundle, not fetched from a CDN.
      A CDN made the preview require internet access, and the unpinned
      'mermaid@11' range meant the version changed under users with no
      plugin release. See MermaidBundle for why it is inlined rather than
      referenced with a relative <script src>.
    -->
    <script>__MERMAID_LIBRARY__</script>
</head>
<body>
    <div id="container">
        <div id="diagram"></div>
        <div id="error" class="hidden">
            <span id="error-message"></span>
            <a href="#" id="report-link" onclick="reportIssue(); return false;">Report this issue</a>
        </div>
    </div>
    <script>
        let currentZoom = 1;
        let panX = 0;
        let panY = 0;
        let isDragging = false;
        let lastX, lastY;

        // Substituted from MermaidSettings.securityMode before the page is loaded.
        // Declared exactly once: every mermaid.initialize() below goes through
        // applyMermaidConfig(), so the initial call and the one on each theme change
        // cannot drift apart the way they did in #44, where this file hardcoded the
        // strict level twice and markdown-init.js hardcoded the loose one.
        let securityLevel = '__SECURITY_LEVEL__';
        let currentTheme = 'default';

        // Substituted from MermaidSettings.mouseWheelZoomEnabled before the page loads,
        // rather than pushed afterwards, so the very first wheel event already obeys the
        // setting. It was one of the Tier 2 settings in #39: a checkbox that saved to
        // disk and changed nothing.
        let mouseWheelZoom = __MOUSE_WHEEL_ZOOM__;

        window.setMouseWheelZoom = function(enabled) {
            mouseWheelZoom = enabled;
        };

        // Both values are always sent together. Mermaid's initialize() merges the given
        // config over its defaults rather than over the previous call, so passing only
        // one of them silently resets the other.
        function applyMermaidConfig() {
            mermaid.initialize({
                startOnLoad: false,
                theme: currentTheme,
                securityLevel: securityLevel
            });
        }

        applyMermaidConfig();

        // Called from Kotlin when the user changes the setting, so an open preview picks
        // it up without being reopened -- the same treatment theme and custom CSS get.
        window.setSecurityLevel = function(level) {
            securityLevel = level;
            applyMermaidConfig();
        };

        /*
          Render requests are queued, and superseded ones are dropped (#45).

          renderDiagram() is fire-and-forget from Kotlin: the typing debounce dispatches
          a fresh call while the previous one may still be running, and Mermaid's render
          time swings by two orders of magnitude with diagram size. Unguarded, that gave
          two distinct failures.

          Ordering -- whichever render finished last won the innerHTML, so a slow render
          of an older buffer could land on top of a newer one and leave the preview
          showing a diagram the editor no longer contains until the next keystroke.

          Collision -- mermaid.render() is passed a fixed element id, and it begins by
          deleting whatever already holds that id. A second overlapping call therefore
          tears the first one's scratch element out of the document mid-render; both
          calls then report success over an empty preview.

          Serialising fixes both. Each request waits for the previous one, so only one
          mermaid.render() is ever in flight and the fixed element id cannot collide.
          Overlapping them would buy nothing anyway: Mermaid's cost is synchronous layout
          on the single JS thread, so concurrent renders interleave rather than finish
          sooner.

          latestRenderId is then checked twice -- when the queue reaches a request, and
          again after its render. The first check means a request the user has already
          typed past costs nothing at all; the second stops an intermediate state being
          painted when a newer request arrived mid-render.
        */
        let latestRenderId = 0;
        let renderChain = Promise.resolve();

        window.renderDiagram = function(source, theme) {
            const renderId = ++latestRenderId;
            const result = renderChain.then(function() {
                return renderOneDiagram(renderId, source, theme);
            });
            // The chain has to survive a failed link. renderOneDiagram() reports render
            // errors itself, but anything escaping it would reject renderChain for good
            // and leave every later render silently unattempted.
            renderChain = result.catch(function() {});
            return result;
        };

        async function renderOneDiagram(renderId, source, theme) {
            // Superseded while queued: this source is already stale, so skip the work
            // rather than render it and throw the result away.
            if (renderId !== latestRenderId) return;

            const diagram = document.getElementById('diagram');
            const error = document.getElementById('error');

            try {
                if (theme) {
                    currentTheme = theme;
                    applyMermaidConfig();
                }

                const { svg } = await mermaid.render('mermaid-diagram', source);
                if (renderId !== latestRenderId) return;

                diagram.innerHTML = svg;
                diagram.classList.remove('hidden');
                error.classList.add('hidden');

                // Only the render that actually landed restores the pan/zoom.
                applyTransform();

                if (window.javaBridge) {
                    window.javaBridge.onRenderSuccess();
                }
            } catch (e) {
                // A stale failure has to stay silent too, or its banner sits over a
                // preview that has since rendered fine.
                if (renderId !== latestRenderId) return;

                const errorMessage = e.message || 'Failed to render diagram';
                document.getElementById('error-message').textContent = errorMessage;
                error.classList.remove('hidden');

                if (window.javaBridge) {
                    window.javaBridge.onRenderError(errorMessage);
                }
            }
        }

        window.setZoom = function(zoom) {
            currentZoom = zoom;
            applyTransform(true);
        };

        window.resetView = function() {
            currentZoom = 1;
            panX = 0;
            panY = 0;
            applyTransform(true);
        };

        window.fitToView = function() {
            const diagram = document.getElementById('diagram');
            const svg = diagram.querySelector('svg');
            if (!svg) return;

            // Reset transform first to get accurate natural dimensions. This reset must
            // NOT animate: the measurement below runs on the very next frame, and an
            // in-flight transition would have it measure a partly-scaled diagram and fit
            // to the wrong size.
            currentZoom = 1;
            panX = 0;
            panY = 0;
            applyTransform();

            // Wait for layout to settle, then calculate fit
            requestAnimationFrame(function() {
                const containerRect = document.getElementById('container').getBoundingClientRect();
                const svgRect = svg.getBoundingClientRect();

                // Add small padding (5%) around the diagram
                const padding = 0.95;
                const scaleX = (containerRect.width * padding) / svgRect.width;
                const scaleY = (containerRect.height * padding) / svgRect.height;

                // Use the smaller scale to fit both dimensions, allow zoom > 1 for small diagrams
                currentZoom = Math.min(scaleX, scaleY);
                panX = 0;
                panY = 0;
                applyTransform(true);

                if (window.javaBridge) {
                    window.javaBridge.onZoomChanged(currentZoom);
                }
            });
        };

        /**
         * Writes the current pan/zoom to the diagram.
         *
         * `animate` is opt-in and belongs only to discrete actions (the zoom buttons,
         * reset, fit). Continuous gestures -- dragging and wheel zoom -- must pass
         * nothing, so each event lands immediately instead of starting a 100ms
         * interpolation the next event restarts.
         *
         * Translation is rounded because a fractional offset makes the compositor
         * resample the layer, which is what turns crisp SVG text fuzzy. Pointer
         * coordinates are integral on most platforms, but not all -- fractional display
         * scaling and browser page zoom both produce fractional clientX.
         */
        function applyTransform(animate) {
            const diagram = document.getElementById('diagram');
            diagram.classList.toggle('animated', animate === true);
            diagram.style.transform =
                'translate(' + Math.round(panX) + 'px, ' + Math.round(panY) + 'px) scale(' + currentZoom + ')';
        }

        window.zoomIn = function() {
            currentZoom = Math.min(10, currentZoom * 1.25);
            applyTransform(true);
            if (window.javaBridge) {
                window.javaBridge.onZoomChanged(currentZoom);
            }
        };

        window.zoomOut = function() {
            currentZoom = Math.max(0.05, currentZoom / 1.25);
            applyTransform(true);
            if (window.javaBridge) {
                window.javaBridge.onZoomChanged(currentZoom);
            }
        };

        document.addEventListener('wheel', function(e) {
            if (!mouseWheelZoom) return;
            if (e.ctrlKey || e.metaKey) {
                e.preventDefault();
                const scrollAmount = Math.abs(e.deltaY);
                const zoomIntensity = 0.003;
                const delta = e.deltaY > 0
                    ? 1 / (1 + scrollAmount * zoomIntensity)
                    : 1 + scrollAmount * zoomIntensity;
                currentZoom = Math.max(0.05, Math.min(10, currentZoom * delta));
                applyTransform();

                if (window.javaBridge) {
                    window.javaBridge.onZoomChanged(currentZoom);
                }
            }
        }, { passive: false });

        document.addEventListener('mousedown', function(e) {
            if (e.button === 0) {
                // Suppress the browser's native drag-to-select, which otherwise
                // highlights every label in the diagram while panning. Left out here so
                // clicks inside the error overlay keep their default behaviour -- the
                // "Report this issue" link must stay clickable and its message
                // selectable.
                if (!e.target.closest('#error')) {
                    e.preventDefault();
                }
                isDragging = true;
                lastX = e.clientX;
                lastY = e.clientY;
                document.body.style.cursor = 'grabbing';
            }
        });

        document.addEventListener('mousemove', function(e) {
            if (isDragging) {
                panX += e.clientX - lastX;
                panY += e.clientY - lastY;
                lastX = e.clientX;
                lastY = e.clientY;
                applyTransform();
            }
        });

        document.addEventListener('mouseup', function() {
            isDragging = false;
            document.body.style.cursor = 'grab';
        });

        // PNG export reports failures as 'error:<reason>' so the Kotlin side
        // can surface them. Previously every failure path sent an empty
        // string, which was silently discarded.
        function pngExportFailed(reason) {
            if (window.javaBridge) {
                window.javaBridge.onPngExport('error:' + reason);
            }
        }

        // scale / transparent come from the plugin settings
        // (pngScaleFactor, pngTransparentBackground), which were previously
        // ignored here: the scale was hardcoded and a backdrop was always painted.
        window.exportAsPng = function(scale, transparent) {
            const svg = document.querySelector('#diagram svg');
            if (!svg) {
                pngExportFailed('no diagram is currently rendered');
                return;
            }

            // Get SVG dimensions from attributes or viewBox
            let width, height;
            const widthAttr = svg.getAttribute('width');
            const heightAttr = svg.getAttribute('height');

            if (widthAttr && heightAttr) {
                width = parseFloat(widthAttr);
                height = parseFloat(heightAttr);
            }

            // Fallback to viewBox
            if (!width || !height || isNaN(width) || isNaN(height)) {
                const viewBox = svg.getAttribute('viewBox');
                if (viewBox) {
                    const parts = viewBox.split(/[\s,]+/);
                    if (parts.length >= 4) {
                        width = parseFloat(parts[2]);
                        height = parseFloat(parts[3]);
                    }
                }
            }

            // Final fallback to getBBox
            if (!width || !height || isNaN(width) || isNaN(height)) {
                const bbox = svg.getBBox();
                width = bbox.width;
                height = bbox.height;
            }

            // Clone SVG and ensure it has explicit dimensions
            const svgClone = svg.cloneNode(true);
            svgClone.setAttribute('width', width);
            svgClone.setAttribute('height', height);

            const svgData = new XMLSerializer().serializeToString(svgClone);

            // A data URL rather than a blob URL. This document is loaded via
            // loadHTML(), and blob URLs minted from its opaque origin can fail
            // to load in an <img> -- which used to abort the export silently.
            const url = 'data:image/svg+xml;base64,' +
                btoa(unescape(encodeURIComponent(svgData)));

            const img = new Image();
            img.onload = function() {
                try {
                    const exportScale = (typeof scale === 'number' && scale > 0) ? scale : 2;
                    const canvas = document.createElement('canvas');
                    canvas.width = width * exportScale;
                    canvas.height = height * exportScale;
                    const ctx = canvas.getContext('2d');

                    // A canvas starts fully transparent, so only paint a
                    // backdrop when a transparent PNG was NOT requested.
                    if (!transparent) {
                        ctx.fillStyle = getComputedStyle(document.getElementById('container')).backgroundColor || '#ffffff';
                        ctx.fillRect(0, 0, canvas.width, canvas.height);
                    }

                    ctx.scale(exportScale, exportScale);
                    ctx.drawImage(img, 0, 0, width, height);

                    // Throws SecurityError if drawing the SVG tainted the
                    // canvas, e.g. via <foreignObject> in Mermaid labels.
                    const dataUrl = canvas.toDataURL('image/png');
                    if (window.javaBridge) {
                        window.javaBridge.onPngExport(dataUrl);
                    }
                } catch (e) {
                    pngExportFailed(e && e.name ? e.name + ': ' + e.message : String(e));
                }
            };
            img.onerror = function() {
                pngExportFailed('the rendered SVG could not be loaded as an image');
            };
            img.src = url;
        };

        window.exportAsSvg = function() {
            const svg = document.querySelector('#diagram svg');
            if (!svg) {
                if (window.javaBridge) window.javaBridge.onSvgExport('');
                return;
            }

            const svgData = new XMLSerializer().serializeToString(svg);
            if (window.javaBridge) {
                window.javaBridge.onSvgExport(svgData);
            }
        };

        /**
         * Replaces the user's custom CSS.
         *
         * Assigned with textContent, not innerHTML, so the CSS is never parsed as markup
         * and a stray '</style>' cannot break out of the element.
         *
         * An empty string is a valid argument and clears the rules -- the caller must be
         * able to remove CSS, not only set it.
         */
        window.applyCustomCss = function(css) {
            document.getElementById('custom-css').textContent = css || '';
        };

        function reportIssue() {
            if (window.javaBridge) {
                window.javaBridge.onReportIssue();
            }
        }
    </script>
</body>
</html>
