name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build plugin
        run: ./gradlew buildPlugin

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: plugin-build
          path: build/distributions/*.zip
          retention-days: 7

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run tests
        run: ./gradlew test

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: build/reports/tests/
          retention-days: 7

  verify:
    name: Verify Plugin - ${{ matrix.ide }}
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      # One IDE per job: each IDE is a 1-2 GB download, so verifying them in a
      # single job exhausts the runner's disk. IntelliJ IDEA Community stopped
      # shipping as a separate product after 2025.2, so 2025.3+ uses IU.
      matrix:
        include:
          - ide: "IntelliJ IDEA 2023.3"
            type: IC
            version: "2023.3.8"     # 233 - minimum supported (sinceBuild)
          - ide: "IntelliJ IDEA 2024.1"
            type: IC
            version: "2024.1.7"     # 241
          - ide: "IntelliJ IDEA 2024.2"
            type: IC
            version: "2024.2.6"     # 242
          - ide: "IntelliJ IDEA 2024.3"
            type: IC
            version: "2024.3.7.1"   # 243
          - ide: "IntelliJ IDEA 2025.1"
            type: IC
            version: "2025.1.7.2"   # 251
          - ide: "IntelliJ IDEA 2025.2"
            type: IC
            version: "2025.2.6.3"   # 252 - last Community release
          - ide: "IntelliJ IDEA 2025.3"
            type: IU
            version: "2025.3"       # 253 - unified IDEA from here on
          - ide: "IntelliJ IDEA 2026.1"
            type: IU
            version: "2026.1"       # 261
          - ide: "IntelliJ IDEA 2026.2"
            type: IU
            version: "2026.2"       # 262 - latest stable
          - ide: "WebStorm 2026.2"
            type: WS
            version: "2026.2"
          - ide: "PyCharm 2025.2"
            type: PC
            version: "2025.2"

    steps:
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify against ${{ matrix.ide }}
        run: |
          ./gradlew verifyPlugin \
            -Pplugin.verifier.ide.type=${{ matrix.type }} \
            -Pplugin.verifier.ide.version=${{ matrix.version }}

      - name: Upload verification results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-results-${{ matrix.type }}-${{ matrix.version }}
          path: build/reports/pluginVerifier/
          retention-days: 7
