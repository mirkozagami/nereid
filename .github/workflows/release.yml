name: Release

on:
  push:
    tags:
      - 'v*'
      - '[0-9]+.[0-9]+.[0-9]+'

jobs:
  release:
    name: Build and Publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          # Must match ci.yml. The build runs Gradle 9.5.1 and verifies against IDEs up
          # to 2026.2; 17 is untested against that toolchain.
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract version from tag
        id: version
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          VERSION=${TAG#v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Verify version matches gradle.properties
        run: |
          GRADLE_VERSION=$(grep "pluginVersion" gradle.properties | cut -d'=' -f2 | tr -d ' ')
          if [ "$GRADLE_VERSION" != "${{ steps.version.outputs.version }}" ]; then
            echo "Error: Tag version (${{ steps.version.outputs.version }}) does not match gradle.properties version ($GRADLE_VERSION)"
            exit 1
          fi

      - name: Build plugin
        run: ./gradlew buildPlugin

      - name: Verify plugin (sinceBuild floor and latest)
        # One IDE per invocation. A bare `verifyPlugin` resolves the full suite -- every
        # release from 233 to 262 across three products -- and exhausts the runner's disk,
        # which is why ci.yml sharded it across jobs. That matrix already runs on every
        # push to master, so this is a final gate on the tagged commit, not full coverage.
        run: |
          ./gradlew verifyPlugin -Pplugin.verifier.ide.type=IC -Pplugin.verifier.ide.version=2023.3.8
          ./gradlew verifyPlugin -Pplugin.verifier.ide.type=IU -Pplugin.verifier.ide.version=2026.2

      - name: Publish to JetBrains Marketplace
        env:
          PUBLISH_TOKEN: ${{ secrets.JETBRAINS_MARKETPLACE_TOKEN }}
        run: ./gradlew publishPlugin

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: v${{ steps.version.outputs.version }}
          body: |
            ## Nereid v${{ steps.version.outputs.version }}

            See [CHANGELOG.md](https://github.com/mirkozagami/nereid/blob/master/CHANGELOG.md) for what changed in this release.

            ### Installation
            - **JetBrains Marketplace**: Search for "Nereid" in your IDE's plugin settings
            - **Manual**: Download the zip file below and install via *Settings → Plugins → ⚙️ → Install Plugin from Disk*
          files: build/distributions/*.zip
          draft: false
          prerelease: false
