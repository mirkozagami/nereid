pluginGroup = com.nereid
pluginName = Nereid
pluginVersion = 1.3.0

platformType = IC
platformVersion = 2023.3

javaVersion = 17
kotlinVersion = 2.4.10

# The IntelliJ Platform bundles its own Kotlin stdlib. Letting the Gradle Kotlin
# plugin add one as well puts two versions on the runtime classpath, which surfaces
# in users' IDEs as ClassNotFoundException or version-mismatch failures.
# See https://jb.gg/intellij-platform-kotlin-stdlib
kotlin.stdlib.default.dependency = false

org.gradle.jvmargs = -Xmx2048m
org.gradle.parallel = true
